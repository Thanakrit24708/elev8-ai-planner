<!DOCTYPE html>
<html lang="th" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Smart Project Planner{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <!-- Tailwind CSS CDN with White-Blue-Yellow Custom Theme -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            blue: '#0284c7',       // Sky/Ocean Blue
                            blueLight: '#e0f2fe',  // Very soft sky
                            blueDark: '#0369a1',   // Deep sky blue
                            yellow: '#f59e0b',     // Bright warm yellow
                            yellowLight: '#fef3c7',// Soft amber
                            yellowDark: '#d97706', // Rich amber
                            white: '#ffffff',
                            cardBg: '#ffffff',
                            surface: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col antialiased text-slate-800 bg-[#f4f7fb]">

    <!-- Top Navigation Bar (White-Blue-Yellow) -->
    <header class="bg-white border-b border-slate-200/90 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Brand / Logo -->
                <a href="{{ url_for('dashboard') }}" class="flex items-center space-x-3 group">
                    <div class="relative">
                        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ELEV8 Logo" class="w-11 h-11 rounded-2xl object-contain shadow-sm border border-slate-200/80 bg-white p-1 transition-transform group-hover:scale-105">
                        <span class="absolute -top-1 -right-1 w-3.5 h-3.5 bg-amber-400 border-2 border-white rounded-full"></span>
                    </div>
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="font-extrabold text-lg text-slate-900 tracking-tight">ELEV8</span>
                            <span class="text-xs px-2 py-0.5 font-bold rounded-md bg-amber-100 text-amber-800">AI Planner</span>
                        </div>
                        <p class="text-[10px] text-slate-400 leading-none">Classroom Task Decomposition</p>
                    </div>
                </a>

                <!-- Desktop Navigation Tabs -->
                <nav class="hidden md:flex space-x-1">
                    <a href="{{ url_for('dashboard') }}" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 {% if request.endpoint == 'dashboard' %}bg-sky-50 text-sky-700 shadow-sm border border-sky-100{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-table-columns text-xs"></i>
                        <span>แดชบอร์ด</span>
                    </a>
                    <a href="{{ url_for('classroom_view') }}" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center space-x-2 {% if request.endpoint == 'classroom_view' %}bg-sky-50 text-sky-700 shadow-sm border border-sky-100{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-cloud-arrow-down text-xs"></i>
                        <span>Google Classroom</span>
                    </a>
                </nav>

                <!-- Right Action & Profile -->
                <div class="flex items-center space-x-3">
                    <a href="{{ url_for('classroom_view') }}" class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-sky-500 to-sky-600 text-white text-xs font-bold rounded-xl shadow-md shadow-sky-500/20 hover:from-sky-600 hover:to-sky-700 transition">
                        <i class="fa-solid fa-plus mr-1.5"></i> วางแผนงานใหม่
                    </a>
                    <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs border border-amber-200">
                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 mb-20 md:mb-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Mobile Bottom Navigation Bar (Matching Wireframe Footer) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200/90 py-2 px-6 z-40 shadow-lg flex justify-between items-center">
        <a href="{{ url_for('dashboard') }}" class="flex flex-col items-center {% if request.endpoint == 'dashboard' %}text-sky-600 font-bold{% else %}text-slate-400{% endif %}">
            <i class="fa-solid fa-bars text-lg"></i>
            <span class="text-[10px] mt-1">เมนู</span>
        </a>
        <a href="{{ url_for('dashboard') }}" class="flex flex-col items-center text-slate-400 hover:text-sky-600">
            <i class="fa-regular fa-clone text-lg"></i>
            <span class="text-[10px] mt-1">โปรเจกต์</span>
        </a>
        <a href="{{ url_for('classroom_view') }}" class="w-12 h-12 -mt-5 rounded-2xl bg-gradient-to-tr from-sky-500 to-sky-600 text-white flex items-center justify-center shadow-lg shadow-sky-500/30 text-xl">
            <i class="fa-solid fa-plus"></i>
        </a>
        <a href="{{ url_for('classroom_view') }}" class="flex flex-col items-center {% if request.endpoint == 'classroom_view' %}text-sky-600 font-bold{% else %}text-slate-400{% endif %}">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
            <span class="text-[10px] mt-1">คอร์ส</span>
        </a>
        <a href="{{ url_for('dashboard') }}" class="flex flex-col items-center text-slate-400">
            <i class="fa-regular fa-circle-user text-lg"></i>
            <span class="text-[10px] mt-1">โปรไฟล์</span>
        </a>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-20 md:bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-sky-600 text-white',
                warning: 'bg-amber-500 text-slate-900 font-bold'
            };
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-circle-xmark',
                info: 'fa-circle-info',
                warning: 'fa-triangle-exclamation'
            };
            toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 text-xs font-semibold transition-all transform duration-300 translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
